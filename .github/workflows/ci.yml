name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only one CI run per branch/PR at a time — a new push cancels the previous run
# instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile makes the install reproducible: if pnpm-lock.yaml does
      # not match package.json, CI fails instead of silently resolving new versions.
      - run: pnpm install --frozen-lockfile

      - name: Lint (prettier + eslint)
        run: pnpm lint

      - name: Typecheck (svelte-check)
        run: pnpm check

      # The client test project runs in a real browser via Playwright.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test:unit --run

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts `pnpm build && pnpm preview` itself.
      - name: Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
