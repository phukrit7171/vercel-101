allowBuilds:
  esbuild: true

overrides:
  # CVE-2024-47764 (low): cookie < 0.7.0 ยอมรับอักขระนอกขอบเขตในชื่อ / path / domain
  # @sveltejs/kit 2.70.1 ยัง pin ^0.6.0 อยู่ ซึ่งไม่ครอบคลุม 0.7.x จึงต้อง override เอง
  # เว็บนี้ prerender ทั้งหมดและไม่ได้แตะ cookie เลย ผลกระทบจริงเป็นศูนย์
  # แต่เคลียร์ไว้ให้ alert ว่าง จะได้เห็นตัวที่สำคัญจริงตอนมันโผล่มา
  # ลบบรรทัดนี้ได้เมื่อ SvelteKit bump เป็น ^0.7 หรือสูงกว่า
  cookie: ^0.7.2
